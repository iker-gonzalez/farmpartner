<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FarmPartner · chat demo</title>
<style>
  body { margin:0; font:15px/1.45 system-ui,-apple-system,sans-serif; background:#d9dbd5; display:flex; justify-content:center; }
  .phone { width:400px; max-width:100%; height:100vh; display:flex; flex-direction:column; background:#efeae2; }
  .top { background:#1f6b47; color:#fff; padding:12px 16px; font-weight:600 } .top small { display:block; font-weight:400; opacity:.8 }
  #log { flex:1; min-height:0; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:6px }
  .m { max-width:85%; padding:7px 10px; border-radius:8px; white-space:pre-wrap; word-wrap:break-word; box-shadow:0 1px 1px #0001 }
  .in { background:#fff; align-self:flex-start } .out { background:#d9fdd3; align-self:flex-end } .sys { align-self:center; font-size:.8rem; color:#555 }
  .bar { display:flex; gap:6px; padding:8px; background:#f0f0f0 } input { flex:1; padding:10px; border-radius:20px; border:1px solid #ccc }
  button { border:0; border-radius:20px; padding:8px 12px; background:#1f6b47; color:#fff; cursor:pointer } button.alt { background:#fff; color:#1f6b47; border:1px solid #1f6b47 }
  .pins { display:flex; gap:6px; padding:6px 8px; flex-wrap:wrap; background:#f7f7f7; font-size:.8rem }
  a { color:#1f6b47 }
</style>
</head>
<body>
<div class="phone">
  <div class="top">FarmPartner 🌾 <button class="alt" style="float:right;padding:4px 10px;font-size:.8rem" onclick="newFarmer()">New farmer</button><small>WhatsApp simulator · same backend as the real bot</small></div>
  <div id="log"></div>
  <div class="pins">
    <span>📍 Send pin:</span>
    <button class="alt" onclick="pin(38.05,-100.75,'Garden City, KS')">Garden City, KS</button>
    <button class="alt" onclick="pin(40.65,-98.30,'Hastings, NE')">Hastings, NE</button>
    <button class="alt" onclick="myLocation()">My location</button>
  </div>
  <div class="bar"><input id="t" placeholder="Type a message" autofocus><button onclick="send()">Send</button></div>
</div>
<script>
  const phone = localStorage.fpPhone || (localStorage.fpPhone = 'demo-' + Math.random().toString(36).slice(2, 8));
  const log = document.getElementById('log'), t = document.getElementById('t');
  t.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  function add(text, cls) {
    const d = document.createElement('div'); d.className = 'm ' + cls;
    d.innerHTML = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*(.+?)\*/g,'<b>$1</b>')
      .replace(/(https?:\/\/\S+)/g, '<a href="$1" target="_blank">$1</a>');
    log.appendChild(d); requestAnimationFrame(() => d.scrollIntoView({block: 'end', behavior: 'smooth'})); return d;
  }
  async function post(body, label) {
    add(label, 'out');
    const r = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({phone, wait: false, ...body}) });
    const j = await r.json(); (j.messages || []).forEach(m => add(m, 'in'));
    if (j.pending) poll(add('⏳ working…', 'sys'));
  }
  async function poll(waitEl) {
    const j = await (await fetch('/api/poll?phone=' + encodeURIComponent(phone))).json();
    (j.messages || []).forEach(m => add(m, 'in'));
    if (j.pending) { setTimeout(() => poll(waitEl), 1500); } else { waitEl.remove(); }
  }
  function newFarmer() { localStorage.fpPhone = 'demo-' + Math.random().toString(36).slice(2, 8); location.reload(); }
  function send() { const v = t.value.trim(); if (!v) return; t.value = ''; post({text: v}, v); }
  function pin(lat, lon, name) { post({lat, lon, text: ''}, '📍 Location: ' + name); }
  function myLocation() { navigator.geolocation.getCurrentPosition(p => pin(p.coords.latitude, p.coords.longitude, 'my location')); }
  add('Say "hi" to start. Type RESET to start over, or tap "New farmer" for a fresh session.', 'sys');
</script>
</body>
</html>
