<!doctype html>
<!-- Cover (poster) for the video on the landing page. Render: node cover.mjs → app/static/video/poster.jpg -->
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; box-sizing:border-box } html, body { width:1920px; height:1080px; overflow:hidden; background:#0a0a0b; color:#f4f4f5 }
  .art { position:absolute; inset:0; background:url(../../app/static/landing/hero.jpg) center/cover; image-rendering:pixelated }

  .tag { position:absolute; right:90px; top:92px; font:700 28px "IBM Plex Mono"; color:#0a0a0b; background:#a8f326; padding:12px 20px; letter-spacing:2px }
  .copy { position:absolute; left:90px; right:90px; bottom:84px }
  .copy p { font:700 30px "IBM Plex Mono"; color:#a8f326; letter-spacing:3px }
  .copy h1 { font:700 124px/1.02 "Space Grotesk"; letter-spacing:-4px; margin-top:20px }
  .copy h1 i { font-style:normal; color:#a8f326 }
</style></head><body>
  <div class="art"></div><div class="shade"></div>
  <div class="top"><img src="../../app/static/brand/orbi.svg" alt=""><b>FarmPartner</b></div>
  <div class="tag">0:30</div>

</body></html>
