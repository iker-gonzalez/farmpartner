[project]
name = "farmpartner"
version = "0.1.0"
description = "Chat-first crop-rotation and field advisor for farmers, built on open NASA Earth data (NASA Space Apps 2026)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pyproj>=3.6",
    "anthropic>=0.70",
    "twilio>=9.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "google-cloud-storage>=2.18",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
